[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "telecaster"
version = "0.2.0b3"
description = "Annotate a shared screen: viewers draw, and the marks appear as an overlay on the sharer's window."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["screen-sharing", "overlay", "annotation", "telestrator", "drawing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X :: Cocoa",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Conferencing",
]
dependencies = [
    "websockets>=13",
    "PySide6>=6.6; sys_platform == 'win32' or sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10", "pillow>=10"]

[project.scripts]
telecaster-relay = "telecaster.relay:main"

[project.gui-scripts]
telecaster = "telecaster.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telecaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
