[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "telecaster"
version = "0.1.0"
description = "Draw on a streamer's screen from the Discord stream you're watching."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["discord", "overlay", "streaming", "telestrator", "drawing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "websockets>=13",
    "PySide6>=6.6; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
telecaster-relay = "telecaster.relay:main"

[project.gui-scripts]
telecaster = "telecaster.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telecaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
